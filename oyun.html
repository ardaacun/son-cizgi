:root {
  /* Layout: tam ekran birinci şahıs görüntü, üstte maç skoru şeridi, takım seçimi / fikstür / sonuç için maç kâğıdı paneli. */
  --night: #080d1e;
  --night-2: #141c3a;
  --turf: #1d6a3b;
  --turf-dark: #185c33;
  --chalk: #eef2e8;
  --amber: #ffc247;
  --goal: #ff5148;
  --cobalt: #2f64ea;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font-family: var(--font-body);
  overflow: hidden;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
  background: var(--night);
}
#stage.playing:not(.showcur) { cursor: none; }
#stage.paused #banner.show { animation-play-state: paused; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Maç şeridi */
.hud {
  position: absolute;
  inset: 0 0 auto 0;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(6, 10, 24, .88), rgba(6, 10, 24, 0));
  transition: opacity .2s;
}
#stage:not(.playing) .hud { opacity: 0; }
.hud-in {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px 28px;
  padding-block: 12px 30px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stat { display: grid; gap: 2px; min-width: 0; }
.lab {
  font: 600 11px/1 var(--font-body);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(238, 242, 232, .66);
}
.val { font: 900 34px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.board { display: grid; gap: 4px; }
.sc-row { display: flex; align-items: baseline; gap: 10px; }
.tm { font: 900 clamp(22px, 4vw, 34px)/1 var(--font-display); letter-spacing: .06em; }
.n { font: 900 clamp(44px, 8vw, 76px)/.9 var(--font-display); color: var(--amber); font-variant-numeric: tabular-nums; }
.dash { font: 700 clamp(30px, 5vw, 48px)/1 var(--font-display); color: rgba(238, 242, 232, .5); }
.pips { display: flex; gap: 6px; height: 34px; align-items: center; }
.pips i { display: block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--amber); }
.pips i.on { background: var(--amber); }
#pauseBtn {
  pointer-events: auto;
  margin-left: auto;
  font: 600 12px/1 var(--font-body);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--chalk);
  background: rgba(8, 13, 30, .6);
  border: 1px solid rgba(238, 242, 232, .4);
  padding: 9px 12px;
  cursor: pointer;
}
#pauseBtn:hover { border-color: var(--amber); color: var(--amber); }
#pauseBtn:focus-visible, .go:focus-visible, .pk-in:focus-visible + .pk { outline: 3px solid var(--amber); outline-offset: 3px; }

/* Sonuç yazısı */
#banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; pointer-events: none; opacity: 0; }
#banner .b-main {
  font: 900 clamp(64px, 16vw, 190px)/.85 var(--font-display);
  letter-spacing: .02em;
  text-transform: uppercase;
  text-shadow: 0 5px 0 rgba(0, 0, 0, .35);
}
#banner .b-sub {
  font: 700 clamp(18px, 3vw, 30px)/1.2 var(--font-display);
  letter-spacing: .2em;
  text-transform: uppercase;
  margin-top: 12px;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .4);
}
#banner.save .b-main { color: var(--amber); }
#banner.parry .b-main { color: var(--chalk); }
#banner.goal .b-main { color: var(--goal); }
#banner.show { animation: pop 1.15s cubic-bezier(.2, .9, .3, 1) forwards; }
@keyframes pop {
  0% { opacity: 0; transform: scale(1.5); }
  14% { opacity: 1; transform: scale(1); }
  78% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(.98); }
}
@keyframes fade { 0% { opacity: 0; } 14% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #banner.show { animation: fade 1.15s linear forwards; } }

/* Menü: sol kenarda tam boy panel, sağda sahne ve eldivenler görünür kalır */
:root { --line: rgba(238, 242, 232, .14); --mut: rgba(238, 242, 232, .62); }
#menu {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: flex-start;
  background: linear-gradient(90deg, rgba(8, 13, 30, .97) 0, rgba(8, 13, 30, .93) 520px, rgba(8, 13, 30, .06) 860px);
}
#menu[hidden] { display: none; }
.panel {
  width: min(500px, 100%);
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-top: 22px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: 22px;
  scrollbar-width: thin;
  scrollbar-color: rgba(238, 242, 232, .3) transparent;
}
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.mark { display: grid; gap: 4px; }
.mark .w {
  font: 900 clamp(60px, 9vw, 86px)/.82 var(--font-display);
  text-transform: uppercase;
  letter-spacing: .005em;
  transform: skewX(-7deg);
  transform-origin: left bottom;
}
.mark .s { font: 600 13px/1.2 var(--font-body); color: var(--mut); }
.mark .w { white-space: nowrap; position: relative; margin-bottom: 14px; }
.mark .w::after { content: ""; position: absolute; left: 0; right: 12%; bottom: -14px; height: 4px; background: var(--chalk); transform: skewX(-20deg); opacity: .9; }
.wallet { display: flex; align-items: center; gap: 8px; font: 900 30px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--amber); }
.wallet small { font: 600 13px/1 var(--font-body); color: var(--mut); }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a8, #e8a91f 70%); box-shadow: inset 0 0 0 2px rgba(120, 70, 0, .45); }
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); }
.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  padding: 4px 0 10px;
  font: 900 22px/1 var(--font-display);
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--mut);
  cursor: pointer;
}
.tab:hover { color: var(--chalk); }
.tab[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--amber); }
.tab:focus-visible, .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.grp { display: grid; gap: 8px; }
.grp h2 { margin: 0; font: 900 22px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.mut { margin: 0; color: var(--mut); font-size: 14px; line-height: 1.5; }
.msg { margin: 0; min-height: 20px; font-size: 14px; color: var(--amber); }

/* Takım listesi */
.list, .items { display: grid; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; }
.row {
  position: relative;
  display: grid;
  grid-template-columns: 14px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  background: rgba(238, 242, 232, .04);
  cursor: pointer;
}
.row:hover { background: rgba(238, 242, 232, .09); }
.row input { position: absolute; opacity: 0; pointer-events: none; }
.row:has(input:checked) { background: rgba(255, 194, 71, .17); }
.row:has(input:checked) .nm { color: var(--amber); }
.row:focus-within { outline: 2px solid var(--amber); outline-offset: -2px; }
.kit { width: 14px; height: 26px; border-radius: 2px; background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); box-shadow: 0 0 0 1px rgba(255, 255, 255, .22); }
.nm { min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.nm small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--mut); }
.pw { font: 900 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }

.cta {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  padding: 18px 0 max(20px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(8, 13, 30, 1) 72%, rgba(8, 13, 30, 0));
}
.go {
  display: block;
  width: 100%;
  font: 900 28px/1 var(--font-display);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--night);
  background: var(--chalk);
  border: 0;
  padding: 18px 28px 17px;
  text-align: left;
  cursor: pointer;
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
}
.go:hover { background: var(--amber); }
.go:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

/* Mağaza */
.item { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 14px; padding: 10px 12px; background: rgba(238, 242, 232, .04); }
.chip { display: block; width: 34px; height: 34px; border-radius: 9px; border: 3px solid var(--chalk); }

  });
  function onSetInput(e) {
    var el = e.target, key = el.getAttribute && el.getAttribute('data-set'); if (!key) return;
    if (el.type === 'checkbox') set[key] = el.checked; else set[key] = +el.value;
    var out = $('o-' + key); if (out) out.textContent = set[key] + (SUF[key] || '');
    if (key === 'cursor') applyCursor();
    if (key === 'vol' || key === 'mute') applyVol();
    saveSet();
  }
  function onSetChange(e) {
    if (e.target.getAttribute && e.target.getAttribute('data-set') === 'vol') { ac(); sfx.parry(); }
  }
  pbox.addEventListener('input', onSetInput); sheet.addEventListener('input', onSetInput);
  pbox.addEventListener('change', onSetChange); sheet.addEventListener('change', onSetChange);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (S.mode !== 'play') return;
      if (S.duo && DU && DU.online && !DU.bot) { if (e.key === 'Escape') { if (pauseEl.hidden) { pauseEl.hidden = false; renderPause('quit'); } else { pauseEl.hidden = true; pbox.innerHTML = ''; } e.preventDefault(); } return; }
      if (S.paused) { if (pv === 'main' || e.key !== 'Escape') resumeGame(); else renderPause('main'); }
      else pauseGame();
      e.preventDefault();
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });
  applyCursor();

  // ---------- Öğretici ----------
  var TUT = [
    ['Kalecisin', 'Fareyi ya da parmağını oynat, eldivenler onu takip eder. Topun gideceği yere eldivenleri götür. İstersen imleci ve hassasiyeti Ayarlar\'dan değiştirebilirsin.'],
    ['Puanlar', 'Topu iki eldivenin ortasında yakalarsan tutuş: 2 puan. Kenarla çelersen 1 puan. 4 puan senin takımına 1 gol yazar. Gol yersen rakip skor alır ve serin sıfırlanır.'],
    ['Modlar', 'Yıldızlar Ligi: 8 haftalık lig aşaması, sonra eleme turları. Hızlı kupa: tek maçlık eleme. Düello: botla şut antrenmanı ya da arkadaşınla online maç. Kazandığın akçelerle mağazadan eldiven, top ve yükseltme alırsın.'],
    ['Şut çekerken', 'Penaltılarda ve Düello\'da şutçu sensin. Fareyle nişan al, basılı tutarak güç yükle, bırakınca şut çıkar. Fazla güç isabeti bozar. Falso için fare tekerleği, Q/E ya da ekrandaki sürgü.']
  ];
  var tutEl = $('tut'), tbox = $('tbox'), tutI = 0;
  function showTut(i) {
    tutI = i; var t = TUT[i], dots = '';
    for (var k = 0; k < TUT.length; k++) dots += '<i' + (k === i ? ' class="on"' : '') + '></i>';
    tbox.innerHTML = '<p class="mut">Nasıl oynanır · ' + (i + 1) + ' / ' + TUT.length + '</p><h2 class="ph sm">' + t[0] + '</h2><p class="tut-t">' + t[1] + '</p><div class="tut-d" aria-hidden="true">' + dots + '</div>' +
      '<div class="pbtns row2"><button class="pb" type="button" data-tu="' + (i ? 'prev' : 'skip') + '">' + (i ? 'Geri' : 'Geç') + '</button><button class="pb main" type="button" data-tu="next" data-focus>' + (i === TUT.length - 1 ? 'Başla' : 'İleri') + '</button></div>';
    tutEl.hidden = false; var f = tbox.querySelector('[data-focus]'); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
  }
  function endTut() { tutEl.hidden = true; tbox.innerHTML = ''; try { localStorage.setItem('kaleci-ogretici', '1'); } catch (e) {} }
  tbox.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-tu]'); if (!b) return;
    var a = b.getAttribute('data-tu');
    if (a === 'next') { if (tutI < TUT.length - 1) showTut(tutI + 1); else endTut(); }
    else if (a === 'prev') showTut(Math.max(0, tutI - 1)); else endTut();
  });
  document.addEventListener('keydown', function (e) { if (!tutEl.hidden && e.key === 'Escape') { endTut(); e.preventDefault(); } });

  // ---------- Başlat ----------
  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, Math.max(0.001, (ts - last) / 1000)); last = ts;
    if (!S.paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
  resize();
  idlePose(); updateHud(); render('select');
  try { if (!localStorage.getItem('kaleci-ogretici')) showTut(0); } catch (e) { showTut(0); }
  requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(frame); });
})();
</script>
